<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Dashboard...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="text-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-indigo-500 mx-auto"></div>
        <h1 class="text-xl font-semibold text-gray-700 mt-6">Loading Your Dashboard</h1>
        <p class="text-gray-500">Please wait while we get things ready for you...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDofE9-vx5XzqPAT7qUdK_ub0L-283kN4M",
            authDomain: "skillpulse-d121f.firebaseapp.com",
            projectId: "skillpulse-d121f",
            storageBucket: "skillpulse-d121f.firebasestorage.app",
            messagingSenderId: "350596146985",
            appId: "1:350596146985:web:8b32779f769623adb4b938",
            measurementId: "G-P3P2Z931K4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function getAbsolutePath(relativeUrl) {
            const currentUrl = window.location.href;
            return currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1) + relativeUrl;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        const userRole = userDocSnap.data().role;
                        let dashboardUrl = 'login.html'; // Default redirect if role is unknown

                        if (userRole === 'student') {
                            dashboardUrl = 'student_dashboard.html';
                        } else if (userRole === 'mentor') {
                            dashboardUrl = 'mentor_dashboard.html';
                        } else if (userRole === 'public') {
                            dashboardUrl = 'public_dashboard.html';
                        }
                        
                        window.location.href = getAbsolutePath(dashboardUrl);

                    } else {
                        console.error("User document not found in Firestore for UID:", user.uid);
                        window.location.href = getAbsolutePath('login.html');
                    }
                } catch (error) {
                    console.error("Error fetching user role:", error);
                    window.location.href = getAbsolutePath('login.html');
                }
            } else {
                // No user is logged in, redirect to login page.
                window.location.href = getAbsolutePath('login.html');
            }
        });
    </script>

</body>
</html>
